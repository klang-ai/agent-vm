<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">agent-vm</title>
  <desc id="desc">An AI agent in a terminal drives a Windows 11 desktop running in a local VM, speaking into its microphone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#121A35"/>
      <stop offset="1" stop-color="#1B1240"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.72" cy="0.38" r="0.45">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.18" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wallpaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="bloom" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="screenClip"><rect x="600" y="92" width="600" height="368" rx="10"/></clipPath>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>
  <rect width="1280" height="560" fill="url(#grid)"/>
  <rect width="1280" height="560" fill="url(#glowBlue)"/>
  <rect width="1280" height="560" fill="url(#glowViolet)"/>

  <!-- Windows desktop (the VM) -->
  <g filter="url(#shadow)">
    <rect x="588" y="64" width="624" height="408" rx="16" fill="#0F172A" stroke="#334155"/>
    <circle cx="610" cy="78" r="4" fill="#475569"/>
    <circle cx="624" cy="78" r="4" fill="#475569"/>
    <circle cx="638" cy="78" r="4" fill="#475569"/>
    <text x="900" y="82" fill="#94A3B8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="middle">win11 · QEMU/KVM · 1920×1080</text>
    <g clip-path="url(#screenClip)">
      <rect x="600" y="92" width="600" height="368" fill="url(#wallpaper)"/>
      <!-- bloom -->
      <g transform="translate(900 250)" opacity="0.9">
        <path d="M0 -120 C 60 -60 60 40 0 110 C -60 40 -60 -60 0 -120Z" fill="url(#bloom)" opacity="0.55"/>
        <path d="M-120 20 C -40 -40 40 -40 120 20 C 40 70 -40 70 -120 20Z" fill="url(#bloom)" opacity="0.45"/>
        <path d="M-90 -80 C -10 -40 30 30 20 110 C -40 60 -90 0 -90 -80Z" fill="#BFDBFE" opacity="0.35"/>
        <path d="M90 -80 C 10 -40 -30 30 -20 110 C 40 60 90 0 90 -80Z" fill="#BFDBFE" opacity="0.35"/>
      </g>
      <!-- app window -->
      <g>
        <rect x="660" y="140" width="300" height="200" rx="10" fill="#F8FAFC" opacity="0.97"/>
        <rect x="660" y="140" width="300" height="30" rx="10" fill="#E2E8F0"/>
        <rect x="660" y="160" width="300" height="10" fill="#E2E8F0"/>
        <text x="676" y="160" fill="#334155" font-family="'Segoe UI', Inter, system-ui, 'DejaVu Sans', sans-serif" font-size="12" font-weight="600">Your app</text>
        <rect x="680" y="188" width="180" height="10" rx="5" fill="#CBD5E1"/>
        <rect x="680" y="208" width="240" height="10" rx="5" fill="#E2E8F0"/>
        <rect x="680" y="228" width="210" height="10" rx="5" fill="#E2E8F0"/>
        <rect x="676" y="252" width="268" height="40" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
        <text x="690" y="277" fill="#0F172A" font-family="'Segoe UI', Inter, system-ui, 'DejaVu Sans', sans-serif" font-size="13">“Hello, this is a test”</text>
        <rect x="864" y="302" width="80" height="26" rx="6" fill="#2563EB"/>
        <text x="904" y="319" fill="#FFFFFF" font-family="'Segoe UI', Inter, system-ui, 'DejaVu Sans', sans-serif" font-size="12" text-anchor="middle" font-weight="600">Save</text>
        <!-- UIA ref badges -->
        <g font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="700">
          <rect x="930" y="244" width="34" height="18" rx="9" fill="#F472B6"/>
          <text x="947" y="257" fill="#1E1B4B" text-anchor="middle">@e4</text>
          <rect x="924" y="294" width="34" height="18" rx="9" fill="#22D3EE"/>
          <text x="941" y="307" fill="#0C4A6E" text-anchor="middle">@e7</text>
        </g>
        <!-- cursor -->
        <path d="M915 312 l0 22 l6 -6 l4 9 l4 -2 l-4 -9 l8 0 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
      </g>
      <!-- taskbar -->
      <rect x="600" y="424" width="600" height="36" fill="#0F172A" opacity="0.72"/>
      <g transform="translate(856 432)">
        <rect x="0" y="0" width="9" height="9" fill="#60A5FA"/>
        <rect x="11" y="0" width="9" height="9" fill="#60A5FA"/>
        <rect x="0" y="11" width="9" height="9" fill="#60A5FA"/>
        <rect x="11" y="11" width="9" height="9" fill="#60A5FA"/>
      </g>
      <rect x="888" y="432" width="20" height="20" rx="5" fill="#334155"/>
      <rect x="916" y="432" width="20" height="20" rx="5" fill="#F8FAFC"/>
      <rect x="944" y="432" width="20" height="20" rx="5" fill="#334155"/>
      <!-- mic indicator -->
      <g transform="translate(1158 433)">
        <rect x="-2" y="-2" width="26" height="22" rx="6" fill="#A855F7" opacity="0.3"/>
        <rect x="7" y="1" width="8" height="11" rx="4" fill="#F5F3FF"/>
        <path d="M4 9 a7 7 0 0 0 14 0" fill="none" stroke="#F5F3FF" stroke-width="1.6"/>
        <line x1="11" y1="16" x2="11" y2="19" stroke="#F5F3FF" stroke-width="1.6"/>
      </g>
    </g>
  </g>

  <!-- Terminal (the agent) -->
  <g filter="url(#shadow)">
    <rect x="68" y="196" width="560" height="300" rx="14" fill="#0A0F1E" stroke="#334155"/>
    <circle cx="90" cy="216" r="5" fill="#F87171"/>
    <circle cx="108" cy="216" r="5" fill="#FBBF24"/>
    <circle cx="126" cy="216" r="5" fill="#34D399"/>
    <text x="348" y="220" fill="#64748B" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="middle">agent — bash</text>
    <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15">
      <text x="92" y="260"><tspan fill="#A78BFA">❯</tspan><tspan fill="#E2E8F0"> agent-vm checkpoint restore </tspan><tspan fill="#FBBF24">clean</tspan></text>
      <text x="92" y="284" fill="#34D399">  ✔ restored 'clean' in 6.1s</text>
      <text x="92" y="314"><tspan fill="#A78BFA">❯</tspan><tspan fill="#E2E8F0"> agent-vm install-app </tspan><tspan fill="#93C5FD">YourApp-setup.exe</tspan></text>
      <text x="92" y="344"><tspan fill="#A78BFA">❯</tspan><tspan fill="#E2E8F0"> agent-vm mic say </tspan><tspan fill="#F9A8D4">"hello, this is a test"</tspan></text>
      <text x="92" y="374"><tspan fill="#A78BFA">❯</tspan><tspan fill="#E2E8F0"> agent-vm ui snapshot -i</tspan></text>
      <text x="92" y="398" fill="#94A3B8">  textbox <tspan fill="#F472B6">@e4</tspan> "hello, this is a test"</text>
      <text x="92" y="420" fill="#94A3B8">  button  <tspan fill="#22D3EE">@e7</tspan> "Save"</text>
      <text x="92" y="450"><tspan fill="#A78BFA">❯</tspan><tspan fill="#E2E8F0"> agent-vm ui click </tspan><tspan fill="#22D3EE">@e7</tspan><tspan fill="#E2E8F0"> </tspan><tspan fill="#E2E8F0" opacity="0.9">▌</tspan></text>
    </g>
  </g>

  <!-- waveform from terminal into the VM's mic -->
  <g transform="translate(700 470)" opacity="0.95">
    <path d="M0 40 Q 12 10 24 40 T 48 40 T 72 40" fill="none" stroke="url(#wave)" stroke-width="3" stroke-linecap="round" transform="translate(-180 0)"/>
    <g stroke="#A78BFA" stroke-width="4" stroke-linecap="round">
      <line x1="-90" y1="34" x2="-90" y2="46"/>
      <line x1="-80" y1="24" x2="-80" y2="56"/>
      <line x1="-70" y1="14" x2="-70" y2="66"/>
      <line x1="-60" y1="28" x2="-60" y2="52"/>
      <line x1="-50" y1="8" x2="-50" y2="72"/>
      <line x1="-40" y1="22" x2="-40" y2="58"/>
      <line x1="-30" y1="32" x2="-30" y2="48"/>
      <line x1="-20" y1="18" x2="-20" y2="62"/>
      <line x1="-10" y1="30" x2="-10" y2="50"/>
      <line x1="0" y1="36" x2="0" y2="44"/>
    </g>
  </g>

  <!-- title -->
  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'DejaVu Sans', sans-serif">
    <text x="68" y="104" fill="#F8FAFC" font-size="56" font-weight="800" letter-spacing="-1.5">agent-vm</text>
    <text x="70" y="142" fill="#CBD5E1" font-size="20">A real Windows desktop your AI agent can drive.</text>
    <text x="70" y="170" fill="#94A3B8" font-size="15">Checkpoints · PowerShell · UI Automation · a mic you can talk into</text>
  </g>
  <text x="1212" y="530" fill="#64748B" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="end">QEMU/KVM · Linux host · Windows 11 guest</text>
</svg>
